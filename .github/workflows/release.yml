name: Release

# Push a tag like v0.1.0 to build a signed APK and publish it as a GitHub Release.
# Obtainium tracks this repo's Releases and installs the attached APK.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches versionName
        run: |
          version=$(grep '^noted.versionName=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match noted.versionName=$version in gradle.properties"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.NOTED_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret NOTED_KEYSTORE_BASE64 is not set; see README 'Releasing'"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "NOTED_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          NOTED_KEYSTORE_PASSWORD: ${{ secrets.NOTED_KEYSTORE_PASSWORD }}
          NOTED_KEY_ALIAS: ${{ secrets.NOTED_KEY_ALIAS }}
          NOTED_KEY_PASSWORD: ${{ secrets.NOTED_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="Noted-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          gh release create "$GITHUB_REF_NAME" "$apk" "$apk.sha256" \
            --title "Noted $GITHUB_REF_NAME" \
            --generate-notes
